<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client & Events Tracker Portal</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --card-border: #2d2d35;
            --accent-blue: #007aff;
            --accent-pink: #ff2d55;
            --text-primary: #ffffff;
            --text-secondary: #a0a0ab;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* Top Header Area */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .progress-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-blue) calc(var(--percent) * 1%), #2c2c35 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-circle::after {
            content: "";
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--bg-color);
        }

        .progress-text {
            position: relative;
            z-index: 1;
            font-size: 14px;
            font-weight: bold;
        }

        .client-title {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        /* Stepper Navigation */
        .stepper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            position: relative;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100px;
            z-index: 1;
        }

        .step-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2c2c35;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .step-item.active .step-number {
            background-color: var(--accent-blue);
            color: #fff;
        }

        .step-label {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.2;
        }

        .step-item.active .step-label {
            color: var(--text-primary);
            font-weight: bold;
        }

        /* Stage Content Card */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
        }

        .stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent-pink);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .stage-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .stage-notes {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .subtasks-box {
            background-color: #17171a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
        }

        .subtasks-header {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="progress-circle" id="progressCircle" style="--percent: 0;">
            <span class="progress-text" id="progressPercent">0%</span>
        </div>
        <div>
            <h1 class="client-title" id="clientName">Loading Event...</h1>
            <p class="subtitle" id="stageSubtitle">Stage -- of --</p>
        </div>
    </div>

    <div class="stepper" id="stepperContainer">
        <!-- Dynamically generated 1-8 step indicators -->
    </div>

    <div class="card">
        <div class="stage-badge">
            <span>📄</span> <span id="currentStageBadge">Stage -- of --</span>
        </div>
        <h2 class="stage-title" id="stageTitle">Loading...</h2>
        <div class="stage-notes" id="stageNotes"></div>

        <div class="subtasks-box">
            <div class="subtasks-header">Sub-Tasks & Deliverables</div>
            <div id="subtasksList" style="color: var(--text-secondary); font-size: 13px;">
                No sub-tasks yet for this stage.
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch JSON based on ?id= query param from URL
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    if (eventId) {
        fetch(`./data/${eventId}.json`)
            .then(response => {
                if (!response.ok) throw new Error("Event data not found");
                return response.json();
            })
            .then(data => renderPortal(data))
            .catch(err => {
                document.getElementById('clientName').innerText = "Event Not Found";
                console.error("Error loading event data:", err);
            });
    }

    function renderPortal(data) {
        document.getElementById('clientName').innerText = data.clientName;
        document.getElementById('progressPercent').innerText = `${data.progressPercent}%`;
        document.getElementById('progressCircle').style.setProperty('--percent', data.progressPercent);
        document.getElementById('stageSubtitle').innerText = `Stage ${data.currentStageIndex} of ${data.stages.length}`;
        
        const activeStage = data.stages[data.currentStageIndex - 1];
        document.getElementById('currentStageBadge').innerText = `Stage ${activeStage.id} of ${data.stages.length}`;
        document.getElementById('stageTitle').innerText = activeStage.name;
        document.getElementById('stageNotes').innerText = activeStage.notes || "No notes for this stage.";

        // Render Sub-Tasks
        const subtasksContainer = document.getElementById('subtasksList');
        if (activeStage.subtasks && activeStage.subtasks.length > 0) {
            subtasksContainer.innerHTML = activeStage.subtasks.map(item => `<div>• ${item}</div>`).join('');
        } else {
            subtasksContainer.innerText = "No sub-tasks yet for this stage.";
        }

        // Render Stepper Bar (1 to N)
        const stepperContainer = document.getElementById('stepperContainer');
        stepperContainer.innerHTML = '';
        
        data.stages.forEach((stage, index) => {
            const isActive = (index + 1) === data.currentStageIndex;
            const stepHtml = `
                <div class="step-item ${isActive ? 'active' : ''}">
                    <div class="step-number">${stage.id}</div>
                    <div class="step-label">${stage.name}</div>
                </div>
            `;
            stepperContainer.innerHTML += stepHtml;
        });
    }
</script>
</body>
</html>
