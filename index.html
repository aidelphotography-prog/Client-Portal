<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --card-border: #2d2d35;
            --accent-blue: #007aff;
            --accent-pink: #ff2d55;
            --text-primary: #ffffff;
            --text-secondary: #a0a0ab;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 900px; width: 100%; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        
        .progress-circle {
            width: 60px; height: 60px; border-radius: 50%;
            background: conic-gradient(var(--accent-blue) calc(var(--percent, 0) * 1%), #2c2c35 0);
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .progress-circle::after {
            content: ""; position: absolute; width: 48px; height: 48px;
            border-radius: 50%; background-color: var(--bg-color);
        }
        .progress-text { position: relative; z-index: 1; font-size: 14px; font-weight: bold; }
        .client-title { font-size: 24px; font-weight: bold; margin: 0 0 4px 0; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0; }

        .stepper { display: flex; justify-content: space-between; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
        .step-item { display: flex; flex-direction: column; align-items: center; width: 100px; min-width: 80px; }
        .step-number {
            width: 36px; height: 36px; border-radius: 50%; background-color: #2c2c35;
            color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 8px;
        }
        .step-item.active .step-number { background-color: var(--accent-blue); color: #fff; }
        .step-label { font-size: 11px; color: var(--text-secondary); text-align: center; }
        .step-item.active .step-label { color: var(--text-primary); font-weight: bold; }

        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; }
        .stage-badge {
            display: inline-flex; align-items: center; gap: 8px; background-color: var(--accent-pink);
            color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 16px;
        }
        .stage-title { font-size: 18px; font-weight: bold; margin: 0 0 8px 0; }
        .stage-notes { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
        .subtasks-box { background-color: #17171a; border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; }
        .subtasks-header { font-size: 13px; font-weight: bold; color: var(--text-secondary); margin-bottom: 8px; }
        
        .error-box { background-color: #2a1517; border: 1px solid #ff2d55; color: #ff8095; padding: 20px; border-radius: 12px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="progress-circle" id="progressCircle">
            <span class="progress-text" id="progressPercent">0%</span>
        </div>
        <div>
            <h1 class="client-title" id="clientName">Loading Event...</h1>
            <p class="subtitle" id="stageSubtitle">Stage -- of --</p>
        </div>
    </div>

    <div class="stepper" id="stepperContainer"></div>

    <div class="card" id="mainCard">
        <div class="stage-badge">
            <span>📄</span> <span id="currentStageBadge">Stage --</span>
        </div>
        <h2 class="stage-title" id="stageTitle">Loading...</h2>
        <div class="stage-notes" id="stageNotes"></div>

        <div class="subtasks-box">
            <div class="subtasks-header">Sub-Tasks & Deliverables</div>
            <div id="subtasksList" style="color: var(--text-secondary); font-size: 13px;"></div>
        </div>
    </div>

    <div class="error-box" id="errorBox">
        <h3 style="margin-top:0">Unable to Load Portal</h3>
        <p id="errorMessage">Invalid or missing portal link.</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const gistId = urlParams.get('id');

    if (gistId) {
        // Fetch live event data directly from GitHub Gist API
        fetch(`https://api.github.com/gists/${gistId}?t=${Date.now()}`)
            .then(res => {
                if (!res.ok) throw new Error("Portal data not found");
                return res.json();
            })
            .then(gistData => {
                const file = Object.values(gistData.files)[0];
                const portalData = JSON.parse(file.content);
                renderPortal(portalData);
            })
            .catch(err => showError(err.message));
    } else {
        showError("No event ID in URL. Please use the link generated by the app.");
    }

    function showError(msg) {
        document.getElementById('mainCard').style.display = "none";
        document.getElementById('errorBox').style.display = "block";
        document.getElementById('errorMessage').innerText = msg;
    }

    function renderPortal(data) {
        document.getElementById('clientName').innerText = data.clientName || 'Client Portal';
        
        const percent = data.progressPercent || 0;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressCircle').style.setProperty('--percent', percent);

        const stages = data.stages || [];
        let currentIdx = data.currentStageIndex ?? 0;
        const activeStage = stages[currentIdx] || stages[0];
        const displayIndex = currentIdx + 1;
        
        document.getElementById('stageSubtitle').innerText = `Stage ${displayIndex} of ${stages.length}`;
        document.getElementById('currentStageBadge').innerText = `Stage ${displayIndex} of ${stages.length}`;
        document.getElementById('stageTitle').innerText = activeStage.name || '';
        document.getElementById('stageNotes').innerText = activeStage.notes || 'No notes for this stage.';

        const subtasksContainer = document.getElementById('subtasksList');
        if (activeStage.subtasks && activeStage.subtasks.length > 0) {
            subtasksContainer.innerHTML = activeStage.subtasks.map(item => `<div>• ${item}</div>`).join('');
        } else {
            subtasksContainer.innerText = "No sub-tasks yet for this stage.";
        }

        const stepperContainer = document.getElementById('stepperContainer');
        stepperContainer.innerHTML = '';
        
        stages.forEach((stage, idx) => {
            const isActive = idx === currentIdx;
            const stepHtml = `
                <div class="step-item ${isActive ? 'active' : ''}">
                    <div class="step-number">${idx + 1}</div>
                    <div class="step-label">${stage.name}</div>
                </div>
            `;
            stepperContainer.innerHTML += stepHtml;
        });
    }
</script>
</body>
</html>
